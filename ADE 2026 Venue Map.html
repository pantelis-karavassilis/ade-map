let fDay=0, fA=0, fB=1440, isNow=false; // day 0 = all days; fA/fB = minutes after 06:00
const pad=n=>String(n).padStart(2,'0');
const hm=m=>{m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
function windows(){const out=[];const ds=fDay?[fDay]:[1,2,3,4,5];ds.forEach(d=>{const z=(d-1)*1440+360;out.push([z+fA,z+fB])});return out}

const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);

// base map (OpenStreetMap water, parks, main roads)
const base=$('base');
function layer(d,cls,sc){if(!d)return;const e=document.createElementNS(NS,'path');e.setAttribute('d',d);e.setAttribute('class',cls);if(sc!==1)e.setAttribute('transform',`scale(${sc})`);base.appendChild(e);}
layer(D.b.po,'park',1);layer(D.b.pc,'park',.5);layer(D.b.wo,'water',1);layer(D.b.wc,'water',.5);

const spots=new Map();
V.forEach(v=>{const k=v.x.toFixed(1)+','+v.y.toFixed(1);if(!spots.has(k))spots.set(k,{x:v.x,y:v.y,vs:[]});spots.get(k).vs.push(v);});
const dotsG=$('dots');const spotArr=[...spots.values()];
spotArr.forEach(s=>{const c=document.createElementNS(NS,'circle');c.setAttribute('cx',s.x);c.setAttribute('cy',s.y);c.setAttribute('class','dot');c.setAttribute('tabindex','-1');s.el=c;s.vs.forEach(v=>v.spot=s);
  c._s=s;

  dotsG.appendChild(c);});

// neighbourhood labels at venue-weighted centroids for the busiest areas
const nbCount={};V.forEach(v=>{(nbCount[v.nb]=nbCount[v.nb]||[]).push(v)});
const labelsG=$('labels');const labelEls=[];
Object.entries(nbCount).filter(([n,a])=>a.length>=6).forEach(([n,a])=>{
  const x=a.reduce((s,v)=>s+v.x,0)/a.length,y=a.reduce((s,v)=>s+v.y,0)/a.length;
  const t=document.createElementNS(NS,'text');t.setAttribute('class','nbl');t.textContent=n.toUpperCase();t.dataset.x=x;t.dataset.y=y-14;labelsG.appendChild(t);labelEls.push(t);});

// view state
let k=1,tx=0,ty=0;
function apply(){
  vp.setAttribute('transform',`translate(${tx} ${ty}) scale(${k})`);
  const r=Math.max(3.2,Math.min(7,2.2+k*0.9))/k;
  spotArr.forEach(s=>s.el.setAttribute('r',(s.vs.length>1?r*1.25:r)*(s.el.classList.contains('sel')?1.5:1)));
  const fs=11/k;
  labelEls.forEach(t=>{t.setAttribute('x',t.dataset.x);t.setAttribute('y',+t.dataset.y/1);t.setAttribute('font-size',fs);t.style.display=k>1.4?'':'none';t.setAttribute('letter-spacing',0.6/k)});
  const h=$('halo');if(sel){h.setAttribute('cx',sel.x);h.setAttribute('cy',sel.y);h.setAttribute('r',16/k)}else h.setAttribute('r',0);
  // scale bar
  const targets=[50,100,200,500,1000,2000,5000];const px=110;const m=px/k*UNIT_M;let best=targets[0];targets.forEach(t=>{if(t<=m)best=t});
  $('sb').style.width=(best/UNIT_M*k)+'px';$('sl').textContent=best>=1000?(best/1000)+' km':best+' m';
}
function fitTo(list,pad=40){
  const r=svg.getBoundingClientRect();if(!r.width)return;
  const xs=list.map(v=>v.x),ys=list.map(v=>v.y);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const w=Math.max(x1-x0,20),h=Math.max(y1-y0,20);
  k=Math.min((r.width-2*pad)/w,(r.height-2*pad)/h);k=Math.min(k,40);
  tx=r.width/2-(x0+x1)/2*k;ty=r.height/2-(y0+y1)/2*k;apply();
}

const listEl=$('list');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function render(){
  const q=norm($('q').value.trim());
  const F=filtering();
  V.forEach(v=>{v.m=venueEvents(v)});
  const shown=V.filter(v=>!F||v.m.length);
  const hits=shown.filter(v=>!q||norm(v.n+' '+v.a+' '+v.nb+' '+v.m.map(e=>e.t).join(' ')).includes(q));
  const hitSet=new Set(hits.map(v=>v.i)),shownSet=new Set(shown.map(v=>v.i));
  spotArr.forEach(s=>{s.el.classList.toggle('off',!s.vs.some(v=>shownSet.has(v.i)));s.el.classList.toggle('dim',!!q&&!s.vs.some(v=>hitSet.has(v.i)))});
  const groups={};hits.forEach(v=>(groups[v.nb]=groups[v.nb]||[]).push(v));
  const order=Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length||a.localeCompare(b));
  listEl.innerHTML=order.length?order.map(g=>`<div class="grp"><span>${esc(g)}</span><span>${groups[g].length}</span></div>`+groups[g].sort((a,b)=>a.n.localeCompare(b.n)).map(v=>`<button class="item${sel&&sel.vs.includes(v)?' on':''}" data-i="${v.i}" role="listitem"><b>${esc(v.n)}</b><span>${esc(v.a)}${v.m.length?` · <span class="cnt">${v.m.length} event${v.m.length>1?'s':''}</span>`:''}</span></button>`).join('')).join(''):(F&&!shown.length?'<div class="empty">Nothing is on in that window. Widen the time range or pick another day.</div>':'<div class="empty">No venues match that search. Try a venue, street, neighbourhood or event name.</div>');
  const nEv=hits.reduce((s,v)=>s+v.m.length,0);
  const when=(fDay?DAYS[fDay-1].lab:'All days')+(fA!==0||fB!==1440?', '+hm(360+fA)+'–'+hm(360+fB):'');
  $('meta').textContent=F||q?`${hits.length} venues · ${nEv} events · ${when}`:`${V.length} venues, ${D.e.length} events. Pick a day or time to see what's on; tap a pin for its program.`;
  return hits;
}
listEl.addEventListener('click',e=>{const b=e.target.closest('.item');if(!b)return;select(V[+b.dataset.i],true);if(matchMedia('(max-width:760px)').matches)wrap.scrollIntoView({behavior:'smooth',block:'start'})});
let qt;$('q').addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(()=>{const h=render();if($('q').value.trim()&&h.length&&h.length<60)fitTo(h,60);else if(!$('q').value.trim())defaultView()},150)});

// day picker + time slider
const daysEl=$('days');
function drawDays(){daysEl.innerHTML=[`<button class="chip" data-d="0" aria-pressed="${fDay===0&&!isNow}">All days</button>`].concat(DAYS.map(x=>`<button class="chip" data-d="${x.d}" aria-pressed="${fDay===x.d&&!isNow}">${x.lab}</button>`)).concat(nowOK()?[`<button class="chip now" data-now="1" aria-pressed="${isNow}">Now</button>`]:[]).join('')}
function amsNow(){const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Amsterdam',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());const g=t=>+p.find(x=>x.type===t).value;if(g('year')!==2026||g('month')!==10)return null;return (g('day')-21)*1440+(g('hour')%24)*60+g('minute')}
function nowOK(){const n=amsNow();return n!==null&&n>=360&&n<5*1440+360}
function setNow(){const n=amsNow();if(n===null)return;const d=Math.floor((n-360)/1440)+1;const off=n-((d-1)*1440+360);fDay=Math.min(5,Math.max(1,d));fA=Math.floor(off/30)*30;fB=Math.min(1440,fA+30);isNow=true}
daysEl.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;if(b.dataset.now){setNow()}else{fDay=+b.dataset.d;if(isNow){fA=0;fB=1440}isNow=false}syncRange();update()});
const t0=$('t0'),t1=$('t1');
function syncRange(){t0.value=fA;t1.value=fB;const L=fA/1440*100,Rr=fB/1440*100;$('tfill').style.left=`calc(9px + (100% - 18px) * ${L/100})`;$('tfill').style.width=`calc((100% - 18px) * ${(Rr-L)/100})`;$('tval').innerHTML=(fA===0&&fB===1440)?'Any time':hm(360+fA)+' – '+hm(360+fB)+(fB-fA===30&&isNow?' (now)':'')}
function onRange(which){let a=+t0.value,b=+t1.value;if(a>b-30){if(which===0)a=b-30;else b=a+30}fA=Math.max(0,a);fB=Math.min(1440,b);isNow=false;syncRange();update()}
t0.addEventListener('input',()=>onRange(0));t1.addEventListener('input',()=>onRange(1));
let ut;function update(){drawDays();clearTimeout(ut);ut=setTimeout(()=>{render();refreshCard()},60)}
drawDays();syncRange();
render();
requestAnimationFrame(defaultView);
let rt;new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(()=>{if(sel)centerOn(sel.vs[0]);else apply()},100)}).observe(wrap);
setTimeout(defaultView,300);
</script>

</body></html>
